version: '3.8'

services:
  web:
    build: .
    container_name: pcbinspect_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pcbinspect
      - MOCK_PLC=True
    depends_on:
      - redis
      - postgres

  celery_worker:
    build: .
    container_name: pcbinspect_celery
    restart: always
    command: celery -A app.services.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pcbinspect
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: pcbinspect_redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: pcbinspect_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pcbinspect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
